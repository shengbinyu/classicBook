<!DOCTYPE html>
<html lang="zh-CN" data-theme="rice">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="经典阁 · 古人经典文献在线阅读：四书、老庄、孙子、孝经等典籍，含全文、注释、白话译文，支持竖排、对照、主题切换。" />
  <title>经典阁 · 古人经典文献在线阅读</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/reader.css" />
  <link rel="stylesheet" href="css/catalog.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    /* 首屏防白屏闪烁：主题基础色 */
    html,body{background:#f5ecd7;color:#2b2b2b;margin:0;}
    #init-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#f5ecd7;z-index:9999;}
    #init-loader .zhuan{width:56px;height:56px;border:3px solid #b23a33;border-top-color:transparent;border-radius:50%;animation:spin .9s linear infinite;}
    #init-loader .txt{font-family:"Songti SC","SimSun",serif;font-size:16px;letter-spacing:.4em;color:#2b2b2b;padding-left:.4em;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
  <script>
    // 启动时读取偏好，避免主题闪烁
    try{
      var s=localStorage.getItem('classic_preferences');
      if(s){var p=JSON.parse(s);if(p&&p.theme)document.documentElement.setAttribute('data-theme',p.theme);}
    }catch(e){}
  </script>
</head>
<body class="yunwen-bg">
  <div id="init-loader"><div class="zhuan"></div><div class="txt">典 籍 装 帧 中</div></div>

  <!-- 顶部导航 -->
  <header id="site-nav" class="site-nav" role="banner">
    <div class="nav-inner">
      <a href="#/" class="brand" aria-label="经典阁首页">
        <img src="assets/icons/logo.svg" alt="" class="brand-logo" />
        <span class="brand-name">经典阁</span>
      </a>

      <nav class="nav-links" aria-label="主导航">
        <a href="#/" class="nav-link"><span class="nav-icon" data-icon="home"></span>首页</a>
        <div class="nav-dropdown" data-dropdown="siku">
          <button class="nav-link btn-nostyle" aria-haspopup="true" aria-expanded="false">
            四库分类<span class="chev" data-icon="chevron-down"></span>
          </button>
          <div class="nav-dropdown-menu siku-menu" id="siku-menu" role="menu"></div>
        </div>
        <div class="nav-dropdown" data-dropdown="dynasty">
          <button class="nav-link btn-nostyle" aria-haspopup="true" aria-expanded="false">
            朝代<span class="chev" data-icon="chevron-down"></span>
          </button>
          <div class="nav-dropdown-menu dynasty-menu" id="dynasty-menu" role="menu"></div>
        </div>
      </nav>

      <div class="nav-actions">
        <form id="search-form" class="search-box" role="search" action="#/search">
          <span class="search-icon" data-icon="search"></span>
          <input id="search-input" type="search" placeholder="搜索书名、篇目、原文…" autocomplete="off" />
        </form>
        <button class="icon-btn" id="btn-theme" title="切换主题"><span data-icon="theme"></span></button>
        <button class="icon-btn menu-toggle" id="btn-menu-toggle" aria-label="展开菜单" title="展开菜单"><span data-icon="menu"></span></button>
      </div>
    </div>
  </header>

  <!-- 主视图容器 -->
  <main id="view" class="site-main" role="main" tabindex="-1"></main>

  <!-- ============== 阅读器专属模板 ============== -->
  <template id="tpl-reader">
    <section class="reader-shell" id="reader-shell">
      <!-- 阅读器工具栏 -->
      <div id="reader-toolbar" class="reader-toolbar" role="toolbar" aria-label="阅读工具栏">
        <a class="icon-btn" data-action="toc" title="目录"><span data-icon="list"></span></a>
        <a class="icon-btn" data-action="bookmark-list" title="书签"><span data-icon="bookmark"></span></a>
        <span class="tb-sep"></span>
        <a class="icon-btn" data-action="prev" title="上一章 (←)"><span data-icon="arrow-left"></span></a>
        <span class="tb-chapter" id="reader-chapter-label">—</span>
        <a class="icon-btn" data-action="next" title="下一章 (→)"><span data-icon="arrow-right"></span></a>
        <span class="tb-sep"></span>
        <a class="icon-btn" data-action="parallel" title="对照模式"><span data-icon="columns"></span><small class="tb-badge" id="tb-parallel-badge">原</small></a>
        <a class="icon-btn" data-action="layout" title="横/竖排"><span data-icon="rotate"></span><small class="tb-badge" id="tb-layout-badge">横</small></a>
        <a class="icon-btn" data-action="font-dec" title="字号减小">A-</a>
        <a class="icon-btn" data-action="font-inc" title="字号增大">A+</a>
        <span class="tb-sep"></span>
        <a class="icon-btn" data-action="add-bookmark" title="添加书签 (Ctrl+B)"><span data-icon="bookmark"></span></a>
        <a class="icon-btn" data-action="note-aside" title="本页注释汇览">注</a>
      </div>

      <!-- 主体：可选目录侧栏 + 正文区 + 注释旁栏 -->
      <div class="reader-body-wrap">
        <aside class="reader-toc-drawer" id="reader-toc-drawer" aria-label="章节目录"></aside>
        <article id="reader-body" class="reader-body layout-horizontal parallel-original" lang="zh-CN"></article>
        <aside class="reader-note-aside" id="reader-note-aside" aria-label="本页注释汇览" hidden>
          <div class="aside-title">本页注释</div>
          <div id="reader-note-list"></div>
        </aside>
      </div>

      <!-- 注释气泡 -->
      <div id="reader-note-popover" class="note-popover" hidden role="dialog" aria-live="polite"></div>

      <!-- 书签抽屉 -->
      <div id="reader-bookmark-drawer" class="drawer" hidden>
        <div class="drawer-head">
          <h3>我的书签</h3>
          <button class="icon-btn btn-nostyle" data-action="close-bookmark" title="关闭"><span data-icon="x"></span></button>
        </div>
        <div id="bookmark-list" class="drawer-body"></div>
      </div>

      <!-- 浮动：移动端上下章按钮 -->
      <div class="reader-float">
        <a class="float-btn" data-action="prev" title="上一章"><span data-icon="arrow-left"></span></a>
        <a class="float-btn" data-action="next" title="下一章"><span data-icon="arrow-right"></span></a>
      </div>
    </section>
  </template>

  <!-- Toast 容器 -->
  <div id="toast-wrap" class="toast-wrap" aria-live="polite"></div>

  <!-- ES Modules 入口 -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
